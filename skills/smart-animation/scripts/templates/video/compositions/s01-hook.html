<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                font: 600 96px/1 ui-sans-serif, system-ui, sans-serif; color: #111827; }
        #word { display: flex; }
        #word span { display: inline-block; opacity: 0; }
      </style>
      <!-- data-cues: scene-local seconds. The timeline below is built FROM these, and
           video-loop.sh reads the same attribute to place sound, so picture and sound share one source. -->
      <div id="root" data-composition-id="s01-hook" data-width="1920" data-height="1080"
           data-cues='[{"t":0.30,"kind":"key"},{"t":0.42,"kind":"key"},{"t":0.54,"kind":"key"},
                       {"t":0.66,"kind":"key"},{"t":0.78,"kind":"key"},{"t":1.55,"kind":"whoosh.short"}]'>
        <div id="word" data-layout-allow-overflow><span>H</span><span>e</span><span>l</span><span>l</span><span>o</span></div>
      </div>
      <script>
        var M = window.motion;  // assets/vendor/motion.js

        var root = document.querySelector('#root');
        var cues = JSON.parse(root.dataset.cues);
        var keys = cues.filter(function (c) { return c.kind === 'key'; });
        var out = cues.filter(function (c) { return c.kind === 'whoosh.short'; })[0];
        var tl = gsap.timeline({ paused: true });
        document.querySelectorAll('#word span').forEach(function (el, i) {
          tl.fromTo(el, { opacity: 0, y: 40 },
            { opacity: 1, y: 0, duration: 0.5, ease: M.springEase(0.5, 0.55, 22) }, keys[i].t);
        });
        tl.to('#word', { x: -1400, duration: 0.6, ease: M.springEase(0.6, 0.9, 14) }, out.t - 0.25);  // apex of the sweep lands on the whoosh cue
        window.__timelines["s01-hook"] = tl;
      </script>
    </template>
  </body>
</html>
