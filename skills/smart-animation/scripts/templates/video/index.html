<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f3f4f6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.5"
         data-width="1920" data-height="1080">
      <!-- One sub-composition per scene. Host id = file's inner data-composition-id = scenes.json id. -->
      <div id="s01-hook" class="clip" data-composition-id="s01-hook"
           data-composition-src="compositions/s01-hook.html"
           data-start="0" data-duration="1.7" data-track-index="0"
           data-width="1920" data-height="1080"></div>
      <div id="s02-lockup" class="clip" data-composition-id="s02-lockup"
           data-composition-src="compositions/s02-lockup.html"
           data-start="1.7" data-duration="1.8" data-track-index="0"
           data-width="1920" data-height="1080"></div>
      <!-- video-loop.sh writes audio/soundtrack.wav from the scenes' data-cues before every check.
           Delete this element if scenes.json sets "audio": "none". -->
      <audio id="soundtrack" src="audio/soundtrack.wav" data-start="0" data-track-index="9"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
